name: Swish checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web-foundation:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Core commit
        id: core
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:vendor/arlecchino-core)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned private Core
        uses: actions/checkout@v4
        with:
          repository: arlecchinoOPSource/Arlecchino-Core
          ref: ${{ steps.core.outputs.sha }}
          path: vendor/arlecchino-core
          ssh-key: ${{ secrets.CORE_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test --prefix vendor/arlecchino-core
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml -p swish-data --locked
      - run: npm run build:native -- -- --locked
      - run: npx playwright install chromium webkit
      - run: npm run test:ui
