name: Installer packages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/installers.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: dmg
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Core pin
        id: core
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:vendor/arlecchino-core)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: arlecchinoOPSource/Arlecchino-Core
          ref: ${{ steps.core.outputs.sha }}
          path: vendor/arlecchino-core
          ssh-key: ${{ secrets.CORE_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test --prefix vendor/arlecchino-core
      - run: cargo test --manifest-path src-tauri/Cargo.toml -p swish-data --locked
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Swish-${{ matrix.os }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
