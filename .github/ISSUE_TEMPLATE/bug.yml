name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result, and actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: App version, Core revision, operating system, and evidence
    validations:
      required: true
  - type: markdown
    attributes:
      value: Use synthetic data. Do not attach private reminders, journals, databases, credentials, or signing keys.
