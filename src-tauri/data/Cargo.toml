[package]
name = "swish-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Swish project/reminder domain and versioned local SQLite storage"
publish = false

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
